    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        /*align-items: center;
        justify-content: center;*/
        /*height: 100vh;*/
        margin: 0;
      }

      .logo {
        font-size: 64px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #4285f4;
      }

      .logo span:nth-child(2) {
        color: #ea4335;
      }
      .logo span:nth-child(3) {
        color: #fbbc05;
      }
      .logo span:nth-child(4) {
        color: #4285f4;
      }
      .logo span:nth-child(5) {
        color: #34a853;
      }
      .logo span:nth-child(6) {
        color: #ea4335;
      }

      .search-box {
        width: 100%;
        max-width: 100px;
        display: flex;
        align-items: center;
        background-color: blue;
        /*border: 3px solid red;*/
        /*border-radius: 30px;*/
        /* padding: 10px 15px; */
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      }

      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        padding: 10px;
        background-color: transparent;
        border-radius: 8px;
      }

      .buttons {
        margin-top: 20px;
      }

      .buttons button {
        margin: 5px;
        padding: 10px 20px;
        border: none;
        background-color: #f8f9fa;
        cursor: pointer;
        border-radius: 4px;
      }

      .buttons button:hover {
        border: 1px solid #dadce0;
      }

      .cool-div {
        width: 100%;
        max-width: 950px;
        height: 100px;
        margin: 5px;
        border-radius: 20px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1523275335684-37898b6baf30"); /* NEW IMAGE */
        background-size: cover;
        background-position: center;
      }
      .content {
        color: white;
        text-align: center;
        padding: 5px;
        position: relative;
        top: 10%;
        transform: translateY(-50%);
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        /*padding: 15px 30px;*/
        background: blue;
        overflow: hidden;
      }

      /*
      .navbar h1 {
        color: #ff3c00;
      }
      */
      .navbar input {
        padding: 8px;
        border-radius: 5px;
        border: none;
        background-color: white;
      }

      .navbar .dropbtn {
        float: left;
        color: white;
        margin-top: 0px;
        text-decoration: none;
        font-weight: bold;
        font:
          16px Arial,
          sans-serif;
      }

      .navbar a {
        float: left;
        color: white;
        padding: 14px 20px;
        text-decoration: none;
      }

      .dropdown {
        float: left;
        overflow: hidden;
      }

      .dropdown .dropbtn {
        cursor: pointer;
        border: none;
        outline: none;
        color: white;
        padding: 14px 20px;
        background-color: inherit;
      }

      .dropdown-content {
        margin-top: 50px;
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      }

      .dropdown-content a {
        float: none;
        color: black;
        padding: 12px 16px;
        display: block;
        text-decoration: none;
      }

      .dropdown-content a:hover {
        background-color: #ddd;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      /* HERO */
      .hero {
        height: 400px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)),
          url("https://images.unsplash.com/photo-1558980664-10b5a33f3b8d");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .hero h2 {
        font-size: 40px;
      }

      /* PRODUCTS */
      .products {
        padding: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }

      .card {
        background: #1a1a1a;
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        transition: 0.3s;
      }

      .card:hover {
        transform: scale(1.05);
      }

      .card img {
        width: 100%;
        border-radius: 10px;
      }

      button {
        margin-top: 10px;
        padding: 10px;
        background: #ff3c00;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 5px;
      }

      /* FOOTER */
      .footer {
        text-align: center;
        padding: 20px;
        background: #000;
        margin-top: 20px;
      }

    <script>
      function searchProducts() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let products = document.getElementsByClassName("card");
        let noResults = document.getElementById("noResults");

        let visibleCount = 0;

        for (let i = 0; i < products.length; i++) {
          let data = products[i].getAttribute("data-search");

          if (data.includes(input)) {
            products[i].style.display = "block";
            visibleCount++;
          } else {
            products[i].style.display = "none";
          }
        }

        // Show "No results"
        if (visibleCount === 0) {
          noResults.style.display = "block";
        } else {
          noResults.style.display = "none";
        }
      }
    </script>
