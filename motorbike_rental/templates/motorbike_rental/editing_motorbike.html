{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Motorbike</title>

    <link rel="stylesheet" href="{% static '/assets/css/edit_motorbike.css' %}">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="top-section">
                <h1>🏍️ Edit Motorbike</h1>
                <p>Update motorbike information</p>
            </div>

            <form method="POST" id="bikeForm">

                {% csrf_token %}

                <div class="form-group">
                    <label>Brand</label>
                    {{ form.bike_make }}
                </div>

                <div class="form-group">
                    <label>Image Url</label>
                    {{ form.bike_imgsrc }}
                </div>

                <div class="form-group">
                    <label>Model</label>
                    {{ form.bike_model }}
                </div>

                <div class="form-group">
                    <label>Plate Number</label>
                    {{ form.bike_plate_number }}
                </div>

                <div class="form-group">
                    <label>Year</label>
                    {{ form.bike_year }}
                </div>



                <div class="form-group">
                    <label>Status</label>
                    {{ form.bike_status }}
                </div>

                <div class="form-group">
                    <label>Daily Rate (£)</label>
                    {{ form.bike_daily_rate }}
                </div>


                <div class="form-group">
                    <label>Bike_id (£)</label>
                    {{ form.bike_id }}
                </div>

                <div class="buttons">

                    <a href="{% url 'manage_motorbikes' %}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="{% static '/assets/js/edit_motorbike.js' %}"></script>

</body>

</html>
