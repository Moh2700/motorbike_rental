<!DOCTYPE html>
<html>

<head>
  <title>Hire Motorbike</title>
  <link rel="stylesheet" href="../static/assets/css/booking.css">
</head>

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #3a3a6a);
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 500px;
  }

  .card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .input-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
  }

  input,
  select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
  }

  input:focus,
  select:focus {
    border-color: #6c63ff;
    outline: none;
    box-shadow: 0 0 5px #6c63ff;
  }

  .price-box {
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: #6c63ff;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
  }

  .btn:hover {
    background: #574fd6;
  }
</style>

<body>

  <div class="container">
    <div class="card">
      <h2>🏍️ Hire a Motorbike</h2>

      <form method="POST">
        {% csrf_token %}

        <div class="input-group">
          <label>Name</label>
          {{ form.customer_name }}
        </div>

        <div class="input-group">
          <label>Phone</label>
          {{ form.customer_phone }}
        </div>

        <div class="input-group">
          <label>Motorbike</label>
          {{ form.motorbike }}
        </div>

        <div class="input-group">
          <label>Driver</label>
          {{ form.driver }}
        </div>

        <div class="input-group">
          <label>Start Time</label>
          {{ form.start_time }}
        </div>

        <div class="input-group">
          <label>End Time</label>
          {{ form.end_time }}
        </div>

        <div class="price-box">
          Total Price: <span id="price">£0</span>
        </div>

        <button type="submit" class="btn">Book Now</button>
      </form>
    </div>
  </div>

  <script src="../static/Js/booking.js"></script>
</body>

</html>
