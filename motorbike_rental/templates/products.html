{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Recommended meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- PyScript CSS -->
    <link
      rel="stylesheet"
      href="https://pyscript.net/releases/2024.2.1/core.css"
    />
    <!-- This script tag bootstraps PyScript -->
    <script
      type="module"
      src="https://pyscript.net/releases/2024.2.1/core.js"
    ></script>
  </head>
  <body>
    <py-script>
      import sys from pyscript import display display(sys.version)
    </py-script>

    <!-- Input to type the section ID -->
    <input type="text" id="sectionInput" placeholder="Enter section ID" />
    <button id="goButton">Go to Section</button>

    <!-- Sections -->
    <section id="section1">Section 1</section>
    <section id="section2">Section 2</section>
    <section id="section3">Section 3</section>

        if (section) {
          // Scroll smoothly to the section
          section.scrollIntoView({ behavior: "smooth" });
        } else {
          alert("Section not found!");
        }
      });
    </script-->
  </body>
</html>
